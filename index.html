<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AskFacet</title>
  <meta name="description" content="AskFacet 是本地优先的轻量数据分析与图表简报工具。">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="page">
    <section class="hero">
      <p class="eyebrow">AskFacet</p>
      <h1>把本地表格变成清晰图表和简报结论</h1>
      <p class="lead">导入 CSV、JSON 或粘贴表格文本，快速检查数据质量、探索问题、生成图表，并保存成适合复盘和分享的图表看板。</p>
      <div class="actions">
        <a class="button primary" href="./support.html">获取支持</a>
        <a class="button" href="./privacy.html">隐私说明</a>
      </div>
    </section>

    <section class="grid">
      <article>
        <h2>本地优先</h2>
        <p>导入、画像、建图和导出默认在设备本地完成，当前版本不需要账号或云端同步。</p>
      </article>
      <article>
        <h2>引导式探索</h2>
        <p>根据字段类型和数据分布推荐可分析的问题，减少从空白表格开始摸索的成本。</p>
      </article>
      <article>
        <h2>简报化输出</h2>
        <p>图表看板保留标题、统计口径、筛选条件、数据范围和关键结论，方便后续复盘。</p>
      </article>
    </section>
  </main>

  <footer>
    <a href="./support.html">技术支持</a>
    <a href="./privacy.html">隐私政策</a>
    <a href="./terms.html">用户协议</a>
  </footer>
</body>
</html>
