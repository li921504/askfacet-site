name: Deploy AskFacet Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: askfacet-site-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Export Pages status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pages" \
            --jq '{build_type, cname, html_url, https_certificate, pending_domain_unverified_at, protected_domain_state, source, status}' \
            > pages-status.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git switch --orphan pages-diagnostics
          git add pages-status.json
          git commit -m "Export Pages status"
          git push --force origin HEAD:pages-diagnostics
          git switch --detach "$GITHUB_SHA"

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
