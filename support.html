<!doctype html>

<head>
  <meta charset="utf-8">

  <title>AskFacet 技术支持</title>
  <meta name="description" content="AskFacet 技术支持与问题反馈。">
  <link rel="stylesheet" href="./styles.css">

<body>
  <main class="page">
    <section class="hero compact">
      <p class="eyebrow">AskFacet Support</p>
      <h1>技术支持</h1>
      <p class="lead">遇到导入、建图、导出、订阅或数据展示问题时，请在 App 的“设置”页复制诊断信息，并随问题描述一起发送给开发者。</p>
    </section>

    <section class="content">
      <h2>反馈时建议包含</h2>
      <ul>
        <li>问题发生的页面和操作步骤。</li>
        <li>是否使用示例数据、CSV、JSON 或粘贴文本。</li>
        <li>App“设置”页复制的诊断信息。</li>
        <li>可公开的截图或录屏，不要发送敏感原始数据。</li>
      </ul>

      <h2>联系邮箱</h2>
      <p><a href="mailto:support@askfacet.com">support@askfacet.com</a></p>
    </section>
  </main>

  <footer>
    <a href="./index.html">首页</a>
    <a href="./privacy.html">隐私政策</a>

  </footer>
